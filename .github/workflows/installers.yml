name: Installers

# An installer for each system (decision 0066): built from the wheel, tried
# (the frozen program writes a script that runs, and its window starts), and
# attached to the GitHub release. A pull request that touches the packaging
# builds them too, so a change cannot break them unseen; the files are kept
# with the run for a week.

on:
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/installers.yml"
      - "pyproject.toml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: installer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
          # The oldest system that is offered: a program built on a newer glibc
          # does not start on an older one, not the other way round.
          - name: Linux
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install the build tools
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Build the wheel
        run: python -m build --wheel --outdir wheel
      - name: Install figscribe from the wheel
        shell: bash
        run: python -m pip install "figscribe[chat,mcp] @ file://$PWD/$(ls wheel/*.whl)"
      - name: Windows only, the installer compiler
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y
      - name: Build the installer
        run: python packaging/make_installer.py
      - name: Try the frozen program
        run: python packaging/smoke.py
      - uses: actions/upload-artifact@v5
        with:
          name: installer-${{ matrix.name }}
          path: |
            packaging/out/*.dmg
            packaging/out/*.exe
            packaging/out/*.AppImage
          retention-days: 7
          if-no-files-found: error

  attach:
    name: attach to the release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # upload to the release; the PyPI workflow has no such right
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: installers
          merge-multiple: true
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" installers/* --repo "${{ github.repository }}"
