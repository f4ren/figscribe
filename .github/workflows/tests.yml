name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request makes the older run pointless. Pushes to
# develop and main are never cancelled.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check --output-format=github .
      - name: Format
        run: ruff format --check .

  pytest:
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The branch protection requires these jobs, so a pull request that only
      # touches the plan, the docs or a Markdown file runs them but not the
      # tests; skipping the whole workflow would leave the checks pending.
      - name: Look at what changed
        id: changes
        shell: bash
        run: |
          other=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            other="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD \
              | grep -vE '^(plan/|docs/|.*\.md$)' || true)"
            if [ -z "$other" ]; then echo "docs_only=true" >> "$GITHUB_OUTPUT"; fi
          fi
      - uses: actions/setup-python@v6
        if: steps.changes.outputs.docs_only != 'true'
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Qt's system libraries
        if: runner.os == 'Linux' && steps.changes.outputs.docs_only != 'true'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        if: steps.changes.outputs.docs_only != 'true'
        run: python -m pip install -e ".[dev]"
      # The slow tests operate every field and action of the GUI; once is
      # enough, on one platform (decision 0028).
      - name: Run tests
        if: steps.changes.outputs.docs_only != 'true'
        run: python -m pytest -q -n auto --dist worksteal ${{ (matrix.os != 'ubuntu-latest' || matrix.python-version != '3.13') && '-m "not slow"' || '' }}

  # The oldest versions pyproject.toml allows (Matplotlib, NumPy, SciPy,
  # pydantic, PySide6), since a floor nobody installs is only a guess. Left
  # out: the images of tests/render/test_images.py, made with the newest
  # Matplotlib, and the GUI tests, which pass from PySide6 6.12 only (decision
  # 0044). Not required by the branch protection.
  minimum-versions:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Look at what changed
        id: changes
        run: |
          other=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            other="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD \
              | grep -vE '^(plan/|docs/|.*\.md$)' || true)"
            if [ -z "$other" ]; then echo "docs_only=true" >> "$GITHUB_OUTPUT"; fi
          fi
      - uses: actions/setup-python@v6
        if: steps.changes.outputs.docs_only != 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Qt's system libraries
        if: steps.changes.outputs.docs_only != 'true'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install the oldest allowed versions
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          python -m pip install uv
          uv venv .venv-min
          uv pip install --python .venv-min/bin/python --resolution lowest-direct -e .
          uv pip install --python .venv-min/bin/python pytest pytest-qt pytest-xdist
      - name: Run tests
        if: steps.changes.outputs.docs_only != 'true'
        run: .venv-min/bin/python -m pytest -q -n auto --dist worksteal -m "not slow" --ignore=tests/render/test_images.py --ignore=tests/gui
