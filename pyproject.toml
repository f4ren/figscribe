[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "figscribe"
dynamic = ["version"]
description = "A lean desktop GUI for scientific Matplotlib plots that exports clean, standalone Python code instead of a proprietary project file."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "f4ren", email = "faren@researchpoint.net" }]
keywords = ["matplotlib", "plotting", "gui", "science", "code-generation"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.15",
]

[project.urls]
Homepage = "https://github.com/f4ren/figscribe"
Source = "https://github.com/f4ren/figscribe"
Issues = "https://github.com/f4ren/figscribe/issues"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.version]
path = "src/figscribe/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/figscribe"]
