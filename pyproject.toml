[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "figscribe"
version = "0.0.1"
description = "A lean desktop GUI for scientific Matplotlib plots that exports clean, standalone Python code instead of a proprietary project file."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Christian Krause" }]
keywords = ["matplotlib", "plotting", "gui", "science", "code-generation"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Homepage = "https://github.com/f4ren/figscribe"
Source = "https://github.com/f4ren/figscribe"
Issues = "https://github.com/f4ren/figscribe/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/figscribe"]
