[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "figscribe"
version = "0.0.1"
description = "Desktop-GUI für wissenschaftliche Matplotlib-Plots, die eigenständigen Python-Code erzeugt"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Christian Krause" }]
keywords = ["matplotlib", "plotting", "gui", "science", "code-generation"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
# TODO: Lizenz festlegen (siehe README)
dependencies = []

[project.urls]
Homepage = "https://github.com/OWNER/figscribe"
Source = "https://github.com/OWNER/figscribe"
Issues = "https://github.com/OWNER/figscribe/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/figscribe"]
