[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "figscribe"
dynamic = ["version"]
description = "A lean desktop GUI for scientific Matplotlib plots that exports clean, standalone Python code instead of a proprietary project file."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "f4ren", email = "faren@researchpoint.net" }]
keywords = ["matplotlib", "plotting", "gui", "science", "code-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.0",
    "pydantic>=2.9",
    "PySide6>=6.7",
    "scipy>=1.13",
]

[project.optional-dependencies]
mcp = [
    "mcp>=2.3",
]
chat = [
    "anthropic>=1.15",
    "openai>=1.60",
]
dev = [
    "anthropic>=1.15",
    "openai>=1.60",
    "mcp>=2.3",
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-xdist>=3.6",
    "ruff>=0.15",
]

[project.scripts]
figscribe = "figscribe.cli:main"

[project.urls]
Homepage = "https://github.com/f4ren/figscribe"
Source = "https://github.com/f4ren/figscribe"
Issues = "https://github.com/f4ren/figscribe/issues"

[tool.ruff]
line-length = 88
# Code blocks in the docs are aligned by hand for reading, not formatted.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: takes most of a minute; run always, skip with -m 'not slow' while iterating",
]

[tool.hatch.version]
path = "src/figscribe/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/figscribe"]

# The start page opens a copy of the example; installed, it lives in the package.
[tool.hatch.build.targets.wheel.force-include]
"examples/gaussian-scan" = "figscribe/examples/gaussian-scan"
